<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Posts &amp; Media</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Posts &amp; Media</h1>
      <p>Local processing workbench · <a href="/api/docs">API docs</a></p>
    </header>
    <main>
      <section>
        <h2>System</h2>
        <p id="system-status" role="status">Checking…</p>
        <pre id="diagnostics"></pre>
      </section>
      <section>
        <h2>Create post</h2>
        <form id="create-form">
          <label>Title <input name="title" maxlength="200" required /></label
          ><label
            >Content
            <textarea name="content" maxlength="10000"></textarea></label
          ><label>Media <input name="media" type="file" multiple /></label
          ><progress id="upload-progress" value="0" max="100" hidden></progress
          ><button>Create</button>
        </form>
      </section>
      <section>
        <h2>Posts</h2>
        <form id="filters-form" class="filters">
          <label>Search <input name="search" /></label
          ><label
            >Media
            <select name="mediaType">
              <option value="">Any</option>
              <option>IMAGE</option>
              <option>AUDIO</option>
              <option>VIDEO</option>
            </select></label
          ><label
            >Status
            <select name="processingStatus">
              <option value="">Any</option>
              <option>PENDING</option>
              <option>PROCESSING</option>
              <option>COMPLETED</option>
              <option>FAILED</option>
            </select></label
          ><label
            ><input name="includeDeleted" type="checkbox" /> Include
            deleted</label
          ><button>Apply</button>
        </form>
        <div id="posts-output" class="posts" aria-live="polite"></div>
        <nav aria-label="Post pages">
          <button id="previous" type="button">Previous</button
          ><span id="page-label"></span
          ><button id="next" type="button">Next</button>
        </nav>
      </section>
      <section>
        <h2>Last response</h2>
        <p id="request-id"></p>
        <pre id="json-output"></pre>
      </section>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
